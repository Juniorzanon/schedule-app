<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shift</title>

<style>
body {
  margin:0;
  font-family:'Segoe UI';
  background:#f4f6fb;
}

/* DARK MODE */
.dark {
  background:#0f172a;
  color:#e5e7eb;
}

.header {
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  background:white;
}

.dark .header {
  background:#1e293b;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card {
  background:white;
  padding:20px;
  margin-bottom:20px;
  border-radius:10px;
}

.dark .card {
  background:#1e293b;
}

.controls {
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.status {
  min-height:22px;
  margin:14px 0 0;
  text-align:center;
  color:#475569;
}

.status.success {
  color:#15803d;
}

.status.error {
  color:#b91c1c;
}

button {
  padding:10px;
  background:#3b6edc;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.clear {
  background:#555;
}

.dark .clear {
  background:#475569;
}

table {
  width:100%;
  border-collapse:collapse;
}

th {
  background:#3b6edc;
  color:white;
  padding:10px;
}

td {
  border:1px solid #eee;
  padding:8px;
}

.dark td {
  border-color:#334155;
}

td[contenteditable] {
  background:#eef3ff;
}

.dark td[contenteditable] {
  background:#1e293b;
}

@media print {
  @page {
    margin:10mm;
  }

  html,
  body {
    background:white;
    color:#000;
    margin:0;
    padding:0;
  }

  .header,
  .container > h2,
  .container > .card:not(#printArea),
  #printTitle {
    display:none !important;
  }

  .container {
    max-width:none;
    margin:0;
    padding:0;
  }

  #printArea {
    width:100%;
    padding:0;
    margin:0;
    background:white;
    color:#000;
    border-radius:0;
  }

  #printArea table {
    width:100%;
    font-size:13px;
  }

  #printArea th,
  #printArea td {
    padding:6px 8px;
  }

  #printArea input {
    display:none;
  }

  #printArea thead {
    display:table-row-group;
  }
}
</style>
</head>

<body>

<div class="header">
  <b>Online Schedule</b>

  <div>
    <button onclick="toggleDark()">🌙</button>
    <button onclick="goHome()">Home</button>
  </div>
</div>

<div class="container">

<h2 style="text-align:center;">Shift</h2>

<div class="card">
  <div class="controls">
    <input type="file" id="fileInput">
    <button id="uploadBtn" onclick="uploadFile()">Upload</button>
  </div>
  <p id="statusMessage" class="status"></p>
</div>

<div class="card">
  <div class="controls">
    <select id="daySelect">
      <option>Mon</option><option>Tue</option><option>Wed</option>
      <option>Thu</option><option>Fri</option><option>Sat</option>
      <option>Sun</option>
    </select>

    <button onclick="generateSchedule()">Generate</button>
    <button onclick="clearTable()" class="clear">Clear</button>
    <button onclick="exportExcel()">Export</button>
    <button onclick="printPage()">Print</button>
  </div>
</div>

<div class="card" id="printArea">
  <h3 id="printTitle">Generated Schedule</h3>
  <table id="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Start</th>
        <th>End</th>
        <th>Break 30</th>
        <th>Break 15</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

</div>

<script>

let currentData = [];
let currentSessionId = null;

function setStatus(message, type = "") {
  const status = document.getElementById("statusMessage");
  status.textContent = message;
  status.className = `status ${type}`;
}

// =======================
// UPLOAD
// =======================
async function uploadFile() {
  const file = document.getElementById("fileInput").files[0];

  if (!file) return alert("Select a file");

  const formData = new FormData();
  formData.append("file", file);

  const btn = document.getElementById("uploadBtn");
  const originalText = btn.innerText;
  btn.innerText = "Uploading...";
  btn.disabled = true;
  setStatus("Uploading and reading schedule...");

  try {
    const res = await fetch("/upload", {
      method: "POST",
      body: formData
    });

    if (!res.ok) {
      const message = await res.text();
      throw new Error(message || "Upload failed.");
    }

    const result = await res.json();
    if (result.success) {
      currentSessionId = result.sessionId;
      currentData = [];
      clearTable();
      setStatus(`Upload done. ${result.count} shifts extracted.`, "success");
    } else {
      throw new Error("Error uploading file.");
    }
  } catch (err) {
    setStatus(err.message || "Error connecting to server.", "error");
  } finally {
    btn.innerText = originalText;
    btn.disabled = false;
  }
}

// =======================
// GENERATE
// =======================
async function generateSchedule() {
  if (!currentSessionId) {
    setStatus("Upload a schedule file before generating.", "error");
    return;
  }

  const day = document.getElementById("daySelect").value;

  try {
    const res = await fetch("/generate", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ day, sessionId: currentSessionId })
    });

    if (!res.ok) {
      const message = await res.text();
      throw new Error(message || "Could not generate schedule.");
    }

    const data = await res.json();
    currentData = data;

    renderTable(data);
    setStatus(`${data.length} shifts found for ${day}.`, "success");
  } catch (err) {
    setStatus(err.message || "Error generating schedule.", "error");
  }
}

// =======================
function renderTable(data) {
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";
  document.getElementById("printTitle").textContent =
    `${document.getElementById("daySelect").value} Schedule`;

  data.forEach(row => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${row.name}</td>
      <td contenteditable>${row.start}</td>
      <td contenteditable>${row.end}</td>
      <td><input type="checkbox"></td>
      <td><input type="checkbox"></td>
    `;

    tbody.appendChild(tr);
  });
}

// =======================
// CLEAR
// =======================
function clearTable() {
  document.querySelector("#table tbody").innerHTML = "";
  currentData = [];
  document.getElementById("printTitle").textContent = "Generated Schedule";
}

function getTableData() {
  return Array.from(document.querySelectorAll("#table tbody tr")).map(row => {
    const cells = row.querySelectorAll("td");

    return {
      name: cells[0].textContent.trim(),
      start: cells[1].textContent.trim(),
      end: cells[2].textContent.trim(),
      break30: cells[3].querySelector("input").checked ? "Yes" : "",
      break15: cells[4].querySelector("input").checked ? "Yes" : ""
    };
  });
}

// =======================
// EXPORT
// =======================
async function exportExcel() {
  const tableData = getTableData();

  if (!tableData.length) {
    setStatus("Generate a schedule before exporting.", "error");
    return;
  }

  try {
    const res = await fetch("/export", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ data: tableData })
    });

    if (!res.ok) {
      const message = await res.text();
      throw new Error(message || "Could not export schedule.");
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "schedule.xlsx";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setStatus("Excel file created.", "success");
  } catch (err) {
    setStatus(err.message || "Error exporting schedule.", "error");
  }
}

// =======================
function printPage() {
  if (!getTableData().length) {
    setStatus("Generate a schedule before printing.", "error");
    return;
  }

  window.print();
}

// =======================
// DARK MODE
// =======================
function toggleDark() {
  document.body.classList.toggle("dark");

  const isDark = document.body.classList.contains("dark");
  localStorage.setItem("darkMode", isDark);
}

(function () {
  const saved = localStorage.getItem("darkMode");
  if (saved === "true") {
    document.body.classList.add("dark");
  }
})();

// =======================
function goHome() {
  window.location.href = "/";
}

</script>

</body>
</html>

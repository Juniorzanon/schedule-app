<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Online Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(135deg, #eef2fb 0%, #e6f0ea 100%);
    color: #1c2434;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border: 1px solid #e6e9f0;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(30, 50, 90, .10);
    padding: 32px 28px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .brand-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, #2fb0a0, #3b6edc);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-name { font-size: 16px; font-weight: 700; }
  .brand-by { font-size: 11px; color: #8a93a6; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: #6b7488; margin-bottom: 22px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #6b7488; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid #d7dced;
    border-radius: 10px;
    outline: none;
    transition: box-shadow .12s, border-color .12s;
  }
  input:focus { border-color: #3b6edc; box-shadow: 0 0 0 3px rgba(59,110,220,.15); }
  .btn-login {
    width: 100%;
    height: 46px;
    margin-top: 6px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #3b6edc;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s, transform .05s;
  }
  .btn-login:hover { background: #2f5ec4; }
  .btn-login:active { transform: scale(.99); }
  .btn-login:disabled { opacity: .7; cursor: default; }
  .error {
    display: none;
    margin-top: 14px;
    padding: 10px 12px;
    font-size: 13px;
    color: #991b1b;
    background: #fff1f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
  }
  .error.show { display: block; }
  .spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Online Schedule</div>
        <div class="brand-by">by Júnior Zanon</div>
      </div>
    </div>

    <h1>Manager login</h1>
    <p class="sub">Sign in to access the schedule dashboard.</p>

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-login" id="loginBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Sign in
    </button>

    <div class="error" id="loginError"></div>
  </form>

<script>
const form = document.getElementById("loginForm");
const btn = document.getElementById("loginBtn");
const errorBox = document.getElementById("loginError");

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.add("show");
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.classList.remove("show");

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  if (!username || !password) { showError("Enter your username and password."); return; }

  btn.disabled = true;
  const original = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> Signing in…';

  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    if (res.ok) {
      window.location.href = "/dashboard.html";
      return;
    }
    const data = await res.json().catch(() => ({}));
    showError(data.message || "Invalid username or password.");
  } catch (err) {
    showError("Could not reach the server. Try again.");
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
});
</script>
</body>
</html>
